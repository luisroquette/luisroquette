<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="curva" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A7FF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <linearGradient id="curvaFundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B2FBE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5A336C" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="#1A1524"/>
  <!-- curva gaussiana -->
  <path d="M120,200 C300,40 480,10 600,92 C720,10 900,40 1080,200 Z" fill="url(#curvaFundo)"/>
  <path d="M120,200 C300,40 480,10 600,92 C720,10 900,40 1080,200"
        fill="none" stroke="url(#curva)" stroke-width="3"/>
  <circle cx="600" cy="92" r="5" fill="#C9A7FF"/>
  <!-- badges -->
  <g font-family="Inter,-apple-system,sans-serif" font-size="15" font-weight="600">
    <rect x="48" y="40" rx="14" width="76" height="28" fill="#2A2338" stroke="#C9A7FF" stroke-opacity="0.4"/>
    <text x="86" y="59" text-anchor="middle" fill="#C9A7FF">MIT</text>
    <rect x="132" y="40" rx="14" width="132" height="28" fill="#2A2338" stroke="#C9A7FF" stroke-opacity="0.4"/>
    <text x="198" y="59" text-anchor="middle" fill="#E9E3F5">Claude Code</text>
    <rect x="272" y="40" rx="14" width="110" height="28" fill="#2A2338" stroke="#C9A7FF" stroke-opacity="0.4"/>
    <text x="327" y="59" text-anchor="middle" fill="#E9E3F5">Codex</text>
    <rect x="390" y="40" rx="14" width="230" height="28" fill="#2A2338" stroke="#D5A62E" stroke-opacity="0.5"/>
    <text x="505" y="59" text-anchor="middle" fill="#D5A62E">Anthropic Partner</text>
  </g>
  <!-- logo CF Gauss no canto inferior direito — vetor puro, sempre renderiza -->
  <g transform="translate(1136,142)">
    <path d="M4,40 Q26,6 48,40" fill="none" stroke="#A76EBA" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,40 Q26,14 52,40" fill="none" stroke="#7B2FBE" stroke-width="5" stroke-linecap="round"/>
    <path d="M-4,40 Q26,24 56,40" fill="none" stroke="#C9A7FF" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
